[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpgate"
version = "0.1.0"
description = "Automated quality gate for MCP servers — ruff + pytest for MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "mcpgate contributors" }]
keywords = ["mcp", "model-context-protocol", "lint", "ai-agents", "pytest", "quality-gate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.0,<2",
  "click>=8.1",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/mcpgate/mcpgate"
Changelog = "https://github.com/mcpgate/mcpgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcpgate/mcpgate/issues"

[project.scripts]
mcpgate = "mcpgate.cli:main"

[project.entry-points.pytest11]
mcpgate = "mcpgate.testing.plugin"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "coverage[toml]>=7.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["PLAN.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "network: requires network access and external MCP servers",
]
testpaths = ["tests"]
addopts = "-m 'not network'"

[tool.coverage.run]
source = ["src/mcpgate"]

[tool.coverage.report]
fail_under = 90
show_missing = true
