repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    stages: [pre-push]
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [pydantic>=2.0, click>=8.1, types-click]
